[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dso"
version = "0.1.0"
description = "Design Search and Optimisation pipeline for HPC workflows"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "spenCliff" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.22.0",
    "scipy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]